<header class="page-footer">
    <div class="footer-top">
        <p class="doc-id">{{ doc_id }}</p>
        <p class="page-num"></p>
        {% if "latest" in version %}
          <p class="subtitle-cover-version"> {{ version }} ({{ curr_date }})</p>
        {% else %}
          <p class="subtitle-cover-version"> {{ version }}</p>
        {% endif %}  
    </div>
    <div class="footer-bottom">
        <p class="copyright">{% trans copyright=copyright|e %}&#169; Copyright {{ copyright }}{% endtrans %}</p>
        <a href="http://{{ theme_website }}">{{ theme_website }}</a>
    </div>
</header>
